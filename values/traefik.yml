# Traefik replaces ingress-nginx (archived upstream). It serves the existing `nginx`-class Ingresses
# unchanged through its ingress-nginx compatibility provider, so every Ingress, its annotations and its
# cert-manager Certificate stay with their app. Gateway API comes later, with Traefik v3.8.
deployment:
  replicas: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1

providers:
  # Reads Ingresses of IngressClass `nginx` (controller k8s.io/ingress-nginx) and their
  # nginx.ingress.kubernetes.io/* annotations. Class-less Ingresses are ignored, like today.
  kubernetesIngressNGINX:
    enabled: true
    # Traefik writes its Service address into Ingress status (external-dns follows it)
    publishService:
      enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: false
  # Gateway-wide middlewares
  file:
    enabled: true
    content:
      http:
        middlewares:
          hsts:
            headers:
              stsSeconds: 31536000
              stsIncludeSubdomains: true
# IngressClass `nginx` still comes from the ingress-nginx app; Traefik doesn't create its own
ingressClass:
  enabled: false
gatewayClass:
  enabled: false
gateway:
  enabled: false

# HSTS on every HTTPS response, as ingress-nginx sends by default. Entrypoint middlewares apply to
# every router on the entrypoint, whichever provider built it.
ports:
  websecure:
    http:
      middlewares:
      - hsts@file

# ingress-nginx logs every request; keep an access log on stdout
accessLog:
  enabled: true

service:
  annotations:
    metallb.universe.tf/address-pool: public
    metallb.universe.tf/allow-shared-ip: shared
    metallb.universe.tf/loadBalancerIPs: 216.218.222.42
  spec:
    # Required to share an IP with web/owncast-rtmp (MetalLB); same client-IP behaviour as ingress-nginx
    externalTrafficPolicy: Cluster
