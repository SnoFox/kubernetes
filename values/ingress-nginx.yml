# Helm chart is located at argocd-apps/apps/ingress-nginx.yaml
# Values are below
controller:
  # TEMPORARY (migration step 3): freeze Ingress status at 216.218.222.42. When the Service becomes
  # ClusterIP (step 4), ingress-nginx would otherwise publish its ClusterIP and external-dns would
  # point public DNS at it. Goes away with ingress-nginx.
  extraArgs:
    update-status: "false"
  config:
    # Partial mitigation for CVE-2026-97205 (AIO use-after-free, fixed in nginx 1.31.7/1.30.6).
    # ingress-nginx is archived (v1.15.1 = nginx 1.27.1, no fix coming) and hard-codes `aio threads;`,
    # so only aio_write can be disabled. Remove once migrated off ingress-nginx.
    enable-aio-write: "false"
  service:
    # Cutover 1/2 (migration step 4): frees 216.218.222.42 for Traefik. nginx keeps running,
    # unexposed, for rollback.
    type: ClusterIP
    annotations:
      metallb.universe.tf/address-pool: public
      metallb.universe.tf/allow-shared-ip: shared
      # Pinned to the IP it already holds so a Traefik cutover rollback returns it here
      # (migration plan step 5). TEMPORARY: goes away when ingress-nginx is removed.
      metallb.universe.tf/loadBalancerIPs: 216.218.222.42
