cronjob:
  # 01:00 opens MRs overnight (outside automergeSchedule); daytime runs automerge while Josh is awake.
  # Several daytime runs because ff-only merges force the other branches to rebase after each merge.
  schedule: '0 1,9,11,13,15 * * *'
  timeZone: 'America/Los_Angeles'
  # Never overlap runs: concurrent runs race each other's branch pushes on GitLab.
  concurrencyPolicy: Forbid
  suspend: false

renovate:
  config: |
    {
      "platform": "gitlab",
      "onboarding": true,
      "requireConfig": "required",
      "autodiscover": true,
      "autodiscoverFilter": "SnoFox/*"
    }

envList:
  - name: RENOVATE_TOKEN
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: gitlab-token
  - name: RENOVATE_GITHUB_COM_TOKEN
    valueFrom:
      secretKeyRef:
        name: renovate-secrets
        key: github-token

extraObjects:
- apiVersion: onepassword.com/v1
  kind: OnePasswordItem
  metadata:
    name: renovate-secrets
    namespace: renovate
  spec:
    itemPath: "vaults/FMT/items/renovate:secrets"

