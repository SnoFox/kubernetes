apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: karakeep

configMapGenerator:
  - envs:
    - env
    name: karakeep-configuration
    behavior: replace

generatorOptions:
  disableNameSuffixHash: true

resources:
  - https://github.com/SnoFox/karakeep//kubernetes?ref=v0.27.2
  - ingress.yaml
  - secrets.yaml

# Pin the images here so Renovate's kustomize manager can update them. The base's own
# KARAKEEP_VERSION replacement runs inside the remote base and ignores our env file.
images:
  - name: ghcr.io/karakeep-app/karakeep
    newTag: 0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
  - name: gcr.io/zenika-hub/alpine-chrome
    # gcr.io/zenika-hub stopped serving (403: billing disabled); same image on Docker Hub.
    newName: docker.io/zenika/alpine-chrome
    newTag: 124@sha256:eb3378c1ed0079f94db054a5fe1aaa790a254ec0d6bbc67eda052420d86a179d
  - name: getmeili/meilisearch
    # v1.41.0 = what karakeep 0.33.2 ships. Moved from v1.11.1 by wiping the index and reindexing (v1.11 has no in-place upgrade path).
    newTag: v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db

patches:
  # meilisearch (LMDB lock) and web (SQLite) each sit on a single-writer PVC; a rolling
  # update starts the new pod while the old one still holds the volume and deadlocks.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: meilisearch
      spec:
        strategy:
          type: Recreate
          rollingUpdate: null
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        strategy:
          type: Recreate
          rollingUpdate: null
  - patch: |-
      - op: replace
        path: /spec/storageClassName
        value: freenas-iscsi-csi
    target:
      kind: PersistentVolumeClaim
  - patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
    target:
      kind: Service
      name: web
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: karakeep-secrets
        namespace: karakeep
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: karakeep
