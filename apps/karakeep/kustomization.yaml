apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: karakeep

configMapGenerator:
  - envs:
    - env
    name: karakeep-configuration
    behavior: replace

generatorOptions:
  disableNameSuffixHash: true

resources:
  - https://github.com/SnoFox/karakeep//kubernetes?ref=v0.27.2
  - ingress.yaml
  - secrets.yaml

# Pin the images here so Renovate's kustomize manager can update them. The base's own
# KARAKEEP_VERSION replacement runs inside the remote base and ignores our env file.
images:
  - name: ghcr.io/karakeep-app/karakeep
    newTag: 0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
  - name: gcr.io/zenika-hub/alpine-chrome
    newTag: 124@sha256:1a0046448e0bb6c275c88f86e01faf0de62b02ec8572901256ada0a8c08be23f
  - name: getmeili/meilisearch
    newTag: v1.11.1@sha256:2ab0c8bdf58b7305e48af7372c47d5638d51dc1bb3a59c8e2b07eca6fe7176e9

patches:
  # meilisearch (LMDB lock) and web (SQLite) each sit on a single-writer PVC; a rolling
  # update starts the new pod while the old one still holds the volume and deadlocks.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: meilisearch
      spec:
        strategy:
          type: Recreate
          rollingUpdate: null
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        strategy:
          type: Recreate
          rollingUpdate: null
  - patch: |-
      - op: replace
        path: /spec/storageClassName
        value: freenas-iscsi-csi
    target:
      kind: PersistentVolumeClaim
  - patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
    target:
      kind: Service
      name: web
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: karakeep-secrets
        namespace: karakeep
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: karakeep
