apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: karakeep

configMapGenerator:
  - envs:
    - env
    name: karakeep-configuration
    behavior: replace

generatorOptions:
  disableNameSuffixHash: true

resources:
  - https://github.com/SnoFox/karakeep//kubernetes?ref=v0.27.2
  - ingress.yaml
  - secrets.yaml

# Pin the images here so Renovate's kustomize manager can update them. The base's own
# KARAKEEP_VERSION replacement runs inside the remote base and ignores our env file.
images:
  - name: ghcr.io/karakeep-app/karakeep
    newTag: 0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
  - name: gcr.io/zenika-hub/alpine-chrome
    newTag: 124@sha256:1a0046448e0bb6c275c88f86e01faf0de62b02ec8572901256ada0a8c08be23f
  - name: getmeili/meilisearch
    newTag: v1.11.3@sha256:6f8f1fc29d1ff67b4d8d503bb4e0a69b55c8d42600decafde951344218193a27

patches:
  - patch: |-
      - op: replace
        path: /spec/storageClassName
        value: freenas-iscsi-csi
    target:
      kind: PersistentVolumeClaim
  - patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
    target:
      kind: Service
      name: web
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: karakeep-secrets
        namespace: karakeep
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: karakeep
