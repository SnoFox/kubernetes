---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: recipes-pg
  namespace: tandoor
  labels:
    app: recipes
    tier: database
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202610120828-system-trixie@sha256:ca4e429e2220e3f6ccbb81a87f783369312a1dcc48793266cd297ca8f8724e47
  instances: 2
  storage:
    storageClass: "freenas-iscsi-csi"
    size: 2Gi
  bootstrap:
    initdb:
      database: recipes
      owner: recipes
      secret:
        name: recipes-pg
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recipes
  namespace: tandoor
spec:
  podSelector: 
    matchLabels:
      app: recipes
      tier: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Allow tandoor to pg
    - podSelector:
        matchExpressions:
          - key: app
            operator: In
            values:
            - recipes
          - key: tier
            operator: In
            values:
            - frontend
    # Allow cnpg operator
    - podSelector:
        matchExpressions:
          - key: app.kubernetes.io/instance
            operator: In
            values:
            - cnpg
    ports:
    - protocol: TCP
      port: 5432
