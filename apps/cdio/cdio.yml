---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cdio
  namespace: cdio
  annotations:
  labels:
    app: cdio
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cdio
  serviceName: cdio
  template:
    metadata:
      labels:
        app: cdio
    spec:
      containers:
      - name: cdio
        image: dgtlmoon/changedetection.io:0.70.3@sha256:47b1e9cc3eff820e6022b655e3fcc948625f60c1770ae8b9c30aa3bf104dc255
        imagePullPolicy: IfNotPresent
        env:
        - name: PLAYWRIGHT_DRIVER_URL
          value: ws://sockpuppet:3000
        - name: BASE_URL
          value: https://cdio.snow-galaxy.ts.net
        - name: TZ
          value: America/Los_Angeles
        resources: {}
        volumeMounts:
        - mountPath: /datastore
          name: data
      - name: sockpuppet
        image: dgtlmoon/sockpuppetbrowser:latest@sha256:453381bb697b8b54e33ed20cee64d444b0a86885c9dc8a2ffbed27ef2b6c153a
        imagePullPolicy: Always
        env:
        - name: SCREEN_WIDTH
          value: "1920"
        - name: SCREEN_HEIGHT
          value: "1024"
        - name: SCREEN_DEPTH
          value: "16"
        - name: MAX_CONCURRENT_CHROME_PROCESSES
          value: "20"
        securityContext:
          capabilities:
            add: ["CAP_SYS_RESOURCE"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "freenas-iscsi-csi"
        resources:
          requests:
            storage: 20Gi
