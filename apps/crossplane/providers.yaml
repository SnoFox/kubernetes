---
# Installed automatically as a dependency of the AWS providers below (constraint ">= 0.0.0"), so Crossplane
# never upgrades it. Declaring it here (same object name) lets Argo own it and Renovate keep it in step.
# Tag only, no digest: with tag@digest Crossplane records the lock source as "<repo>:<tag>", and the member
# providers' dependency on "<repo>" stops resolving (missing dependencies).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-family-aws
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-family-aws:v2.10.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-dynamodb
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-aws-dynamodb:v2.10.0@sha256:4aad4c721c0ad948067cf6259c32b968a603cc6c69b45324fa42b205986a3cb9
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-iam
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-aws-iam:v2.10.0@sha256:fc68c47f7967497d146c8670f4fa4755139ceca1fbd94dbf339b9c115a4936ef
